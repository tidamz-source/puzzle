<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Classement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111014; --panel: #1c1a22; --line: #2e2b36;
    --ink: #f4f1ea; --muted: #8d8899; --accent: #ffcc33; --ko: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh; padding: 32px 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: clamp(28px, 6vw, 40px); }
  .live { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px; }
  .row {
    display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px;
    padding: 16px 14px; border-radius: 12px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .rank { font: 700 28px "JetBrains Mono", monospace; color: var(--muted); text-align: center; }
  .row.first { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .row.first .rank { color: var(--accent); }
  .name { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .meta { font: 500 14px "JetBrains Mono", monospace; color: var(--muted); text-align: right; }
  .meta b { color: var(--ink); font-weight: 700; display: block; font-size: 16px; }
  .row.pending { opacity: .45; }
  .row.pending .rank { font-size: 20px; }
  .code { font: 500 13px "JetBrains Mono", monospace; color: var(--muted); margin-top: 4px; display: none; }
  .showcodes .code { display: block; }

  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  button {
    font: 700 15px "Space Grotesk", sans-serif; border-radius: 12px; padding: 12px 18px;
    cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button.danger { color: var(--ko); border-color: color-mix(in srgb, var(--ko) 40%, transparent); }
  button.primary { background: var(--accent); color: #111014; border: 0; }

  /* Connexion */
  #login { max-width: 360px; margin: 12vh auto 0; display: flex; flex-direction: column; gap: 12px; }
  #login input {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    color: var(--ink); font: 500 16px "Space Grotesk", sans-serif; padding: 14px;
  }
  .err { color: var(--ko); min-height: 20px; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<form id="login" class="hidden">
  <h1>Back-office</h1>
  <input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
  <input id="pwd" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
  <button class="primary" type="submit">Se connecter</button>
  <div id="loginErr" class="err"></div>
</form>

<div id="dash" class="wrap hidden">
  <header>
    <h1>Classement</h1>
    <span class="live">En direct</span>
  </header>
  <div id="board" class="card"></div>
  <div class="tools">
    <button id="toggleCodes">Afficher les codes</button>
    <button id="reset" class="danger">Réinitialiser la partie</button>
    <button id="logout">Déconnexion</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { firebaseConfig } from "./config.js";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const $ = (id) => document.getElementById(id);

  let teams = {}, entries = {}, unsubs = [];

  onAuthStateChanged(auth, (user) => {
    unsubs.forEach((u) => u()); unsubs = [];
    $("login").classList.toggle("hidden", !!user);
    $("dash").classList.toggle("hidden", !user);
    if (!user) return;

    const onErr = (e) => {
      console.error(e);
      $("board").innerHTML = `<div class="row"><span></span><span>Accès refusé : ce compte n'est pas déclaré admin dans la base.</span></div>`;
    };
    unsubs.push(onValue(ref(db, "teams"), (s) => { teams = s.val() || {}; render(); }, onErr));
    unsubs.push(onValue(ref(db, "entries"), (s) => { entries = s.val() || {}; render(); }, onErr));
  });

  $("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginErr").textContent = "";
    try { await signInWithEmailAndPassword(auth, $("email").value, $("pwd").value); }
    catch { $("loginErr").textContent = "Identifiants incorrects."; }
  });
  $("logout").onclick = () => signOut(auth);
  $("toggleCodes").onclick = () => {
    const on = $("board").classList.toggle("showcodes");
    $("toggleCodes").textContent = on ? "Masquer les codes" : "Afficher les codes";
  };
  $("reset").onclick = async () => {
    if (!confirm("Effacer toutes les participations et repartir de zéro ?")) return;
    await remove(ref(db, "entries"));
  };

  const fmt = (ts) => new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" })
    + "." + String(ts % 1000).padStart(3, "0");
  const fmtDelta = (ms) => {
    const s = ms / 1000;
    return s < 60 ? `+${s.toFixed(1)} s` : `+${Math.floor(s / 60)} min ${Math.round(s % 60)} s`;
  };
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function render() {
    // Première participation de chaque code = heure d'arrivée de l'équipe
    const finished = Object.entries(entries).map(([code, list]) => ({
      code,
      ts: Math.min(...Object.values(list).map((v) => v.ts)),
      tries: Object.keys(list).length
    })).sort((a, b) => a.ts - b.ts);

    const done = new Set(finished.map((f) => f.code));
    const pending = Object.keys(teams).filter((c) => !done.has(c));
    const first = finished[0]?.ts;

    const row = (code, rank, cls, meta) => {
      const t = teams[code] || { name: "Code inconnu", color: "#888" };
      return `<div class="row ${cls}">
        <div class="rank">${rank}</div>
        <div>
          <div class="name"><span class="dot" style="background:${esc(t.color)}"></span>${esc(t.name)}</div>
          <div class="code">${esc(code)}</div>
        </div>
        <div class="meta">${meta}</div>
      </div>`;
    };

    $("board").innerHTML =
      finished.map((f, i) => row(f.code, i + 1, i === 0 ? "first" : "",
        `<b>${fmt(f.ts)}</b>${i === 0 ? "premier" : fmtDelta(f.ts - first)}`)).join("") +
      pending.map((c) => row(c, "–", "pending", "en cours")).join("");
  }
</script>
</body>
</html>
