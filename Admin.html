<!doctype html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111014; --panel: #1c1a22; --line: #2e2b36;
    --ink: #f4f1ea; --muted: #8d8899; --accent: #ffcc33; --ko: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Space Grotesk", system-ui, sans-serif; min-height: 100vh; padding: 32px 16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: clamp(28px, 6vw, 40px); }
  .live { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; animation: blink 1.4s infinite; }
  .live.off::before { background: var(--ko); animation: none; }
  @keyframes blink { 50% { opacity: .3; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px; }
  .row { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; padding: 16px 14px; border-radius: 12px; }
  .row + .row { border-top: 1px solid var(--line); }
  .rank { font: 700 28px "JetBrains Mono", monospace; color: var(--muted); text-align: center; }
  .row.first { background: rgba(255, 204, 51, .12); }
  .row.first .rank { color: var(--accent); }
  .name { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .meta { font: 500 14px "JetBrains Mono", monospace; color: var(--muted); text-align: right; }
  .meta b { color: var(--ink); font-weight: 700; display: block; font-size: 16px; }
  .row.pending { opacity: .45; }
  .row.pending .rank { font-size: 20px; }
  .code { font: 500 13px "JetBrains Mono", monospace; color: var(--muted); margin-top: 4px; display: none; }
  .showcodes .code { display: block; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  button { font: 700 15px "Space Grotesk", sans-serif; border-radius: 12px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.danger { color: var(--ko); border-color: rgba(255, 92, 92, .4); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Classement</h1>
    <span id="live" class="live">En direct</span>
  </header>
  <div id="board" class="card"><div class="row"><span></span><span>Chargement…</span></div></div>
  <div class="tools">
    <button id="toggleCodes">Afficher les codes</button>
    <button id="reset" class="danger">Réinitialiser la partie</button>
  </div>
</div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  // Récupère la clé passée dans l'adresse (?admin=…)
  var KEY = null;
  google.script.url.getLocation(function (loc) {
    KEY = loc.parameter.admin;
    poll();
    setInterval(poll, 2000);
  });

  var busy = false;
  function poll() {
    if (busy) return;
    busy = true;
    google.script.run
      .withSuccessHandler(function (data) { busy = false; $('live').className = 'live'; render(data); })
      .withFailureHandler(function () { busy = false; $('live').className = 'live off'; })
      .getRanking(KEY);
  }

  function pad(n, l) { n = String(n); while (n.length < l) n = '0' + n; return n; }
  function fmt(ts) {
    var d = new Date(ts);
    return pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' + pad(d.getSeconds(), 2) + '.' + pad(d.getMilliseconds(), 3);
  }
  function fmtDelta(ms) {
    var s = ms / 1000;
    return s < 60 ? '+' + s.toFixed(1) + ' s' : '+' + Math.floor(s / 60) + ' min ' + Math.round(s % 60) + ' s';
  }
  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function row(t, rank, cls, meta) {
    return '<div class="row ' + cls + '"><div class="rank">' + rank + '</div><div>' +
      '<div class="name"><span class="dot" style="background:' + esc(t.color) + '"></span>' + esc(t.name) + '</div>' +
      '<div class="code">' + esc(t.code) + '</div></div><div class="meta">' + meta + '</div></div>';
  }

  function render(data) {
    var first = data.finished.length ? data.finished[0].ts : 0;
    $('board').innerHTML =
      data.finished.map(function (t, i) {
        return row(t, i + 1, i === 0 ? 'first' : '', '<b>' + fmt(t.ts) + '</b>' + (i === 0 ? 'premier' : fmtDelta(t.ts - first)));
      }).join('') +
      data.pending.map(function (t) { return row(t, '–', 'pending', 'en cours'); }).join('');
  }

  $('toggleCodes').onclick = function () {
    var on = $('board').classList.toggle('showcodes');
    this.textContent = on ? 'Masquer les codes' : 'Afficher les codes';
  };
  $('reset').onclick = function () {
    if (!confirm('Effacer toutes les participations et repartir de zéro ?')) return;
    google.script.run.withSuccessHandler(poll).resetGame(KEY);
  };
</script>
</body>
</html>
